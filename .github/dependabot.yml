version: 2
updates:
  # The public portfolio tracks a verified dependency baseline. Routine version-update
  # PRs are paused to keep the repository review queue clean. Dependabot security
  # updates/alerts are managed separately by GitHub and are not disabled here.
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/samantha/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/samantha/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the successfully built documentation to GitHub Pages"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # openwakeword currently resolves tflite-runtime on Linux, whose
          # published wheels support CPython through 3.11.
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --extra docs

      # Inject the public Supabase anon key so the savings leaderboard works on
      # the published docs site. Missing/empty (e.g. fork PRs) leaves the
      # leaderboard gracefully disabled. The key is read from env (not inlined)
      # and JSON-encoded into a JS string literal to avoid any injection.
      - name: Inject leaderboard Supabase anon key
        env:
          SAMANTHA_LEADERBOARD_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          key = os.environ.get("SAMANTHA_LEADERBOARD_ANON", "")
          pathlib.Path("docs/javascripts/leaderboard-config.js").write_text(
              "// Generated at docs-build time from the VITE_SUPABASE_ANON_KEY secret.\n"
              "window.SAMANTHA_SUPABASE_ANON_KEY = " + json.dumps(key) + ";\n",
              encoding="utf-8",
          )
          print("leaderboard anon key:", "set" if key else "empty (leaderboard disabled)")
          PY

      - name: Build documentation
        run: uv run mkdocs build

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  deploy:
    # Publishing is deliberately manual in the clean public edition so forks
    # and initial setup cannot deploy into an unconfigured Pages environment.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
